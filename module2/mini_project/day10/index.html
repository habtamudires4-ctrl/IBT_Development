<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Facts Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <header>
      <h1>Country Facts Explorer</h1>
      <p>Search global country details powered by REST Countries API</p>
    </header>

    <!-- Search Form -->
    <form id="search-form" class="search-box">
      <input 
        type="text" 
        id="country-input" 
        placeholder="Enter country name (e.g. Ethiopia)" 
        required
      />
      <button type="submit">Search</button>
    </form>

    <!-- Main Container for Loading, Success, and Error UI -->
    <section id="facts" class="facts-card"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
