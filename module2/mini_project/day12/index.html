<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch | Live ETB Exchange Rates</title>
    <!-- Modern Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <header class="header">
            <div class="brand">
                <span class="currency-icon">🇪🇹</span>
                <h1>Birr Watch</h1>
            </div>
            <p>Live ETB Exchange Rates</p>
        </header>
        
        <div id="status-container" class="status-container" aria-live="polite">
            <p id="status" class="status-message">Loading live exchange rates...</p>
        </div>

        <section class="main-content" id="main-content" style="display: none;">
            <form id="convert-form" class="convert-form" onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label for="amount">Amount (ETB)</label>
                    <input type="number" id="amount" name="amount" min="0.01" step="0.01" value="1" placeholder="0.00" required>
                </div>

                <div class="input-group">
                    <label for="currency">Target Currency</label>
                    <div class="select-wrapper">
                        <select id="currency" name="currency"></select>
                    </div>
                </div>
            </form>

            <div class="result-container">
                <div class="result-header">
                    <span class="result-label">Conversion Result</span>
                    <button type="button" id="watch-btn" class="btn-icon-link" title="Pin to Watchlist">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        <span>Add to Watchlist</span>
                    </button>
                </div>
                <p id="result" class="result-value">Enter an amount</p>
            </div>
            
            <section class="watchlist-section" aria-labelledby="watchlist-title">
                <div class="watchlist-header">
                    <h2 id="watchlist-title">Saved Watchlist</h2>
                    <span class="live-badge">Live Updates</span>
                </div>
                <ul id="watchlist" class="watchlist">
                    <!-- Dynamic Watchlist Items -->
                </ul>
            </section>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
