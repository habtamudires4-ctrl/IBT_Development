<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Addis Eats - Order delicious Ethiopian food in Addis Ababa.">

    <title>Addis Eats - Ethiopian Food Ordering</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-content">

            <div class="logo">
                <span class="logo-icon">🍴</span>

                <div>
                    <h1>Addis Eats</h1>
                    <p>Ethiopian Food Delivery</p>
                </div>
            </div>

            <div class="search-container">
                <label for="search" class="visually-hidden">
                    Search dishes
                </label>

                <input type="search" id="search" placeholder="Search dishes..." autocomplete="off">
            </div>

        </div>
    </header>


    <!-- Main Content -->
    <main class="container main-content">

        <!-- Menu Section -->
        <section id="menu-section" aria-label="Food menu">

            <div class="section-heading">
                <div>
                    <p class="small-title">OUR MENU</p>
                    <h2>Popular Ethiopian Dishes</h2>
                </div>

                <label for="category">
                    Category:
                    <select id="category">
                        <option value="All">All</option>
                    </select>
                </label>
            </div>

            <!-- Loading/Error messages -->
            <p id="menu-message" class="message">
                Loading menu...
            </p>

            <!-- JavaScript will render dishes here -->
            <div id="menu" class="menu-grid" aria-label="Menu">
            </div>

        </section>


        <!-- Cart Section -->
        <aside id="cart" class="cart" aria-label="Your order">
            <!-- JavaScript will render cart here -->
        </aside>

    </main>


    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="checkout-title">

        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <p class="small-title">CHECKOUT</p>
                    <h2 id="checkout-title">Complete Your Order</h2>
                </div>

                <button id="close-modal" class="close-button" type="button" aria-label="Close checkout">
                    ×
                </button>
            </div>


            <form id="checkout-form" novalidate>

                <div class="form-group">
                    <label for="customer-name">
                        Full Name
                    </label>

                    <input type="text" id="customer-name" name="name" placeholder="Enter your full name">

                    <small id="name-error" class="error-message"></small>
                </div>


                <div class="form-group">
                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel" id="phone" name="phone" placeholder="09XXXXXXXX">

                    <small id="phone-error" class="error-message"></small>
                </div>


                <div class="form-group">
                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea id="address" name="address" rows="3" placeholder="Enter your delivery address"></textarea>

                    <small id="address-error" class="error-message"></small>
                </div>


                <div class="form-group">
                    <label for="payment">
                        Payment Method
                    </label>

                    <select id="payment" name="payment">
                        <option value="">
                            Select payment method
                        </option>

                        <option value="TeleBirr">
                            TeleBirr
                        </option>

                        <option value="Cash">
                            Cash on Delivery
                        </option>
                    </select>

                    <small id="payment-error" class="error-message"></small>
                </div>


                <div class="checkout-summary">
                    <span>Total</span>

                    <strong id="checkout-total">
                        0 ETB
                    </strong>
                </div>


                <button type="submit" class="checkout-submit">
                    Place Order
                </button>

            </form>

        </div>

    </div>


    <!-- Success Message -->
    <div id="success-message" class="success-message hidden" role="alert">
        <div class="success-icon">✓</div>

        <div>
            <strong>Order placed successfully!</strong>
            <p>Thank you for ordering from Addis Eats.</p>
        </div>
    </div>


    <!-- Footer -->
    <footer class="footer">
        <div class="container">

            <p>
                Addis Eats · Addis Ababa, Ethiopia
            </p>

            <p>
                Delicious Ethiopian food delivered to your door.
            </p>

        </div>
    </footer>


    <script src="app.js"></script>

</body>

</html>
