<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bole Roast Specialty Coffee | Business Profile Card</title>
    <!-- Google Web Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <header class="card-header">
            <span class="badge">Open Now</span>
            <h1 class="business-name">Bole Roast Specialty Coffee</h1>
            <p class="tagline">Single-Origin Yirgacheffe &amp; Fresh Roasts</p>
        </header>

        <section class="card-body">
            <p class="description">
                Serving freshly brewed artisanal Ethiopian coffee, signature pastries, and quick breakfast combos in Bole. TeleBirr &amp; CBE Birr payments accepted.
            </p>
            <div class="location-info">
                <span>📍 Bole Atlas, Next to Morning Star Mall</span>
            </div>
        </section>

        <footer class="card-footer">
            <button type="button" class="btn btn-primary">Contact Cafe</button>
        </footer>
    </main>

</body>
</html>
