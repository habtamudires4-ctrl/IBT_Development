<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETB Shopping & Item Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>ETB Item Tracker</h1>

        <!-- Form to add items -->
        <form id="item-form">
            <div class="form-group">
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" placeholder="e.g., Coffee Beans" required>
            </div>

            <div class="form-group">
                <label for="item-price">Price (ETB)</label>
                <input type="number" id="item-price" step="0.01" min="0" placeholder="e.g., 250" required>
            </div>

            <button type="submit" id="add-btn">Add Item</button>
        </form>

        <!-- Total Display -->
        <section class="total-section">
            <h2>Running Total: <span id="total-display">0.00</span> ETB</h2>
        </section>

        <!-- Item List Container -->
        <section class="list-section">
            <ul id="item-list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
